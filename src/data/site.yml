home:
  tagline: Physicist, quant and occasional artist.
  welcome: Welcome to my page, where I share my research, writing and projects across physics, finance and AI.
  about: >-
    I hold doctorates in particle physics and astrophysics and spent a decade searching for the cosmic
    sources of neutrinos within international collaborations. I then moved to quantitative finance,
    building machine-learning systems for an insurer and an alpha research platform for a global
    investment bank, where I led a team of quants. Machine learning has been my working tool throughout;
    my current research focuses on AI.
  studio_line: I also draw and compose music —
  writing_line: Thoughts on science, markets — and anything else that catches my curiosity.
  studio_title: Space and sound
  studio_card: Drawings, paintings and music — where curiosity takes another form.
  background:
    - title: Astroparticle physics
      text: ANTARES · Pierre Auger · Cherenkov Telescope Array · IceCube. 200+ publications, including Science.
    - title: Quantitative finance
      text: Swiss Life · TD Securities. Data science and ML engineering; quantitative research and team leadership.
    - title: Artificial intelligence
      text: Research on how language models reason and plan under uncertainty.

about:
  intro: |-
    I am a scientist and quantitative researcher, applying machine learning and AI where it makes a real difference. After fifteen years of research — in astroparticle physics, then in finance — I founded Pontus Analytics, which builds AI, machine-learning and physics-simulation solutions for quantitative finance, defence and R&D.

    What drives me is extracting reliable signal from noisy, complex data, and turning it into systems people can use. Away from work, I am an avid reader, I compose and play music, and I make visual art.
  chapters:
    - title: Physics
      text: >-
        My research began with the ANTARES neutrino telescope, deep in the Mediterranean, and continued with
        the Pierre Auger Observatory, the Cherenkov Telescope Array and IceCube at the South Pole — with
        positions at Aix-Marseille University, Michigan State University, LPNHE in Paris and CERN. The common
        thread was the search for the cosmic sources of high-energy neutrinos: faint signals buried in
        overwhelming backgrounds. Machine-learning methods were central to that search, which contributed to
        the evidence for neutrino emission from the blazar TXS 0506+056, published in Science in 2018.
    - title: Markets
      text: >-
        In 2018 I brought the same methods to finance. At a major insurer I led the data science behind a
        production robo-advisory engine, combining sequence models with evolutionary optimisation. At a
        global investment bank I then designed and built a fixed-income research platform from scratch —
        from signal generation to backtesting and real-time analytics — adopted across trading desks, and
        built the quant team that extended it to other asset classes.
    - title: Artificial intelligence
      text: >-
        Machine learning has run through all of this work, from classifying particle events to detecting
        signals in bond markets. My current research studies how language models reason and plan under
        uncertainty, using benchmarks where the optimal decision is known exactly — so that a model’s
        behaviour can be measured, not guessed.
